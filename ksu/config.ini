# iQOO Neo9S Pro 全屏AOD 配置（v1.5）
# 改完保存 → 在 KSU 管理器点模块的「执行 / Action」即时生效，不用重启。

# 面板能力串里的 support_full_screen 取值：1 / 2 / 3
SUPPORT_FULL_SCREEN=1

# 面板串里的 aod_brightness（原值 956）；留空 = 保持原值
AOD_BRIGHTNESS=

# 是否给「熄屏显示」App 打补丁（改掉它的机型白名单判断，等价于当年 LSPosed 干的事）
#   1 = 打（默认，设置里才会出现「局部/全屏」选择）
#   0 = 不打（恢复原版 App，只能靠 settings 里已有的 type=3 维持全屏）
PATCH_APK=1

# 任意追加/覆盖面板串里的键值（逗号分隔），例如：doze_suspend_fps=0,support_1hz=1
OVERRIDES=

# 是否伪造面板能力串：1=挂载 support_full_screen=1 的副本；0=只写属性、不动 sysfs
MOUNT_SYSFS=1

# 智能熄屏（persist.vivo.phone.smart_aod）：0=关闭（静止也能持续刷新） 1=开启 留空=不改
SMART_AOD=

# 直接改 AOD 类型：1=局部  2=融合（本机实测唯一能实时刷新）  3=全屏（静态）；留空=不改
AOD_TYPE=2

# 应用配置后是否重启「熄屏显示」进程：1=重启（改动立即生效） 0=保持热进程（测试进 AOD 黑屏时长用）
KILL_APP=1

# 1 = 整体关掉（撤掉两个挂载，退回原厂状态），用于快速回滚
DISABLE=0
