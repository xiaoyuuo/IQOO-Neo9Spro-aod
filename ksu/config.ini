# iQOO Neo9S Pro 全屏AOD 配置（v8.0）
# 改完保存 → 在 KSU 管理器点模块的「执行 / Action」即时生效，不用重启。

# ---------- 开启全屏 AOD ----------
SUPPORT_FULL_SCREEN=1
MOUNT_SYSFS=1

# 假节点的做法：
#   tmpfs = 用 tmpfs + context 造一个「标签正确」的假节点（v8.0 推荐）
#   auto  = 先试直写真节点，失败再 bind mount（旧逻辑）
#   mount = 只 bind mount 一个 /data 副本（标签靠 chcon，常失败）
SYSFS_MODE=tmpfs

# 布局写转发：夜明珠会把 AOD 布局坐标写进这个节点，
# 转发给真节点之后，AOD 内容的居中/排版才会正确。1=开 0=关
FWD_LAYOUT=1

# 面板串里的 aod_brightness：留空 = 保持原厂 956
AOD_BRIGHTNESS=

# 额外覆盖面板串键值，例如：support_video_aod=1,doze_suspend_fps=30
OVERRIDES=

# 熄屏显示 App 补丁：装不上/挂不上，保持 0
PATCH_APK=0

# ---------- AOD 亮度与超时 ----------
# 固定亮度：>0 时进 AOD 固定写这个值、不跑阶梯；0 = 走阶梯
AOD_FIX_LEVEL=0

# 阶梯：秒:百分比。60 秒→70%，180 秒（3 分钟）→熄灭
AOD_STEPS=60:70,180:1

# 阶梯最后一档写的档位（1 = 几乎全黑）
AOD_OFF_LEVEL=1

# AOD 超时守护总开关
AOD_TIMEOUT=1

# ---------- 功耗相关 ----------
# 传感器桥：1=启用（读光线/运动 + goToSleep 真熄屏）
# ⚠️ 它每秒写一次 sensor.state、持续监听光线与加速度传感器，是主要耗电源之一。
SENSOR_BRIDGE=0

# lux 超过这个值认为有光，不压暗也不熄屏（仅 SENSOR_BRIDGE=1 时有效）
AOD_LIGHT_SKIP=1000

# 来消息是否重置 AOD 计时器：1=保留 0=关闭（更省电）
AOD_NOTIFY_RESET=1

# 守护诊断日志：0=只记关键事件（省电） 1=每个事件都记
AOD_DEBUG=0

# AOD 类型变化监视：1=开 0=关
MODEWATCH=0
MODEWATCH_SEC=30

# ---------- 其它 ----------
SMART_AOD=0
AUTO_BRIGHT=0
BRIGHT_GUARD=0
GUARD_DEBUG=0

# AOD 类型：1=局部 2=融合 3=全屏；留空=不改
# v7.5：默认不再写这个键，避免设置页/夜明珠状态不一致导致闪退。
APPLY_AOD_TYPE=0
AOD_TYPE=2

DISABLE=0
